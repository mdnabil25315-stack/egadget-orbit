<!DOCTYPE html>
<html lang="bn" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Gadget Orbit - Premium Tech & Gadget Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        neon: {
                            blue: '#00f0ff',
                            purple: '#7000ff',
                            green: '#00ff66'
                        },
                        darkbg: '#0f172a',
                        cardbg: '#1e293b'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', 'Inter', sans-serif; transition: background-color 0.3s, color 0.3s; }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .light .glass-card { background: rgba(255, 255, 255, 0.8); border: 1px solid rgba(0, 0, 0, 0.08); }
        .neon-glow { box-shadow: 0 0 15px rgba(0, 240, 255, 0.3); }
        .neon-glow:hover { box-shadow: 0 0 25px rgba(0, 240, 255, 0.6); }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #00f0ff; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col transition-colors duration-300">

    <!-- Announcement Bar -->
    <div class="bg-gradient-to-r from-cyan-600 via-indigo-600 to-purple-600 text-white text-xs sm:text-sm font-medium py-2 px-4 text-center flex justify-between items-center">
        <span class="mx-auto flex items-center gap-2">
            <i class="fa-solid fa-truck-fast"></i>
            Sara Bangladesh-e Cash on Delivery ebong Drutotomo Home Delivery!
        </span>
        <button id="themeToggle" class="bg-slate-800/40 hover:bg-slate-800 p-1.5 rounded-full text-xs transition">
            <i class="fa-solid fa-sun text-amber-300 hidden dark:block"></i>
            <i class="fa-solid fa-moon text-slate-700 block dark:hidden"></i>
        </button>
    </div>

    <!-- Header -->
    <header class="sticky top-0 z-40 bg-slate-900/90 dark:bg-slate-900/90 backdrop-blur-md border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between gap-4">
            <a href="#" class="flex items-center gap-2 group">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-purple-600 flex items-center justify-center text-white font-black text-xl shadow-lg">
                    E
                </div>
                <div>
                    <span class="text-xl font-extrabold tracking-wide text-white">E-Express</span> <span class="text-cyan-400 font-bold">Orbit</span>
                    <span class="block text-[10px] text-slate-400 tracking-wider">PREMIUM GADGET STORE</span>
                </div>
            </a>

            <div class="hidden md:flex flex-1 max-w-md mx-6 relative">
                <input type="text" id="searchInput" onkeyup="filterProducts()" placeholder="Earbud, Headset ba Gaming Gear khujun..." class="w-full bg-slate-800 text-slate-200 placeholder-slate-400 text-sm rounded-full py-2.5 pl-10 pr-4 focus:outline-none focus:ring-2 focus:ring-cyan-500 border border-slate-700">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-slate-400 text-sm"></i>
            </div>

            <div class="flex items-center gap-3 sm:gap-5">
                <a href="https://wa.me/8801700000000" target="_blank" class="hidden sm:flex items-center gap-2 text-xs text-emerald-400 bg-emerald-950/40 border border-emerald-800/50 px-3 py-1.5 rounded-full hover:bg-emerald-900/40 transition">
                    <i class="fa-brands fa-whatsapp text-lg"></i>
                    <span>Hotline Support</span>
                </a>
                <button id="cartBtn" class="relative p-2.5 bg-slate-800 hover:bg-slate-700 rounded-full text-slate-200 transition">
                    <i class="fa-solid fa-cart-shopping text-lg"></i>
                    <span id="cartBadge" class="absolute -top-1 -right-1 bg-cyan-500 text-slate-900 text-xs font-bold w-5 h-5 rounded-full flex items-center justify-center">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
        <h2 class="text-xl font-bold text-white mb-6 border-l-4 border-cyan-500 pl-3">Amader Best Selling Gadgets</h2>
        <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
    </main>

    <script>
        const products = [
            {
                id: 1,
                name: "Hona EQ34 Plus ANC+ENC TWS Headset",
                category: "audio",
                price: 1050,
                oldPrice: 1650,
                badge: "HOT DEAL",
                image: "https://images.unsplash.com/photo-1590658268037-6bf12165a8df?auto=format&fit=crop&w=600&q=80",
                desc: "Active Noise Cancellation (ANC) & Environmental Noise Cancellation (ENC) with Touch Control."
            },
            {
                id: 2,
                name: "AirPods Pro Matte Black Edition",
                category: "audio",
                price: 950,
                oldPrice: 1500,
                badge: "POPULAR",
                image: "https://images.unsplash.com/photo-1600294037681-c80b4cb5b434?auto=format&fit=crop&w=600&q=80",
                desc: "Transparency Mode, Custom High-Excursion Driver & Sweat/Water Resistant (IPX4)."
            },
            {
                id: 3,
                name: "Plextone RX3 Plus RGB Gaming Earphone",
                category: "gaming",
                price: 1140,
                oldPrice: 1800,
                badge: "GAMING GEAR",
                image: "https://images.unsplash.com/photo-1546435770-a3e426bf472b?auto=format&fit=crop&w=600&q=80",
                desc: "RGB Lighting for Gamers, Crystal Clear Mic & E-Sport Driver."
            }
        ];

        function renderProducts(items = products) {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = items.map(p => `
                <div class="glass-card rounded-2xl p-4 border border-slate-700 hover:border-cyan-500 transition-all flex flex-col justify-between">
                    <div>
                        <div class="relative rounded-xl overflow-hidden mb-4 aspect-square bg-slate-800">
                            <img src="${p.image}" alt="${p.name}" class="w-full h-full object-cover">
                            <span class="absolute top-2 left-2 bg-cyan-500 text-slate-900 text-[10px] font-extrabold px-2 py-1 rounded-md">
                                ${p.badge}
                            </span>
                        </div>
                        <h3 class="font-bold text-white text-base mb-1 line-clamp-1">${p.name}</h3>
                        <p class="text-xs text-slate-400 mb-3 line-clamp-2">${p.desc}</p>
                    </div>
                    <div>
                        <div class="flex items-center gap-2 mb-4">
                            <span class="text-xl font-extrabold text-cyan-400">৳${p.price}</span>
                            <span class="text-xs text-slate-500 line-through">৳${p.oldPrice}</span>
                        </div>
                        <button class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-900 font-bold py-2 rounded-xl text-xs transition">
                            Order Korun
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function filterProducts() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = products.filter(p => p.name.toLowerCase().includes(query));
            renderProducts(filtered);
        }

        document.addEventListener('DOMContentLoaded', () => renderProducts());
    </script>
</body>
</html>
